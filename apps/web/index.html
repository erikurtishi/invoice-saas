<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Default title/description + social card for crawlers and the first paint.
         `useLandingSeo()` (X.6.3 / L1.3) re-runs on React mount and on every
         language switch, reusing these same tags — so JS clients get per-locale
         copy while non-JS social scrapers still get a valid English card.
         Absolute-URL + real-platform card validation is V1.5.4 (needs the domain). -->
    <title>Invoice SaaS — branded invoices for the Balkans, in minutes</title>
    <meta
      name="description"
      content="Set up your business once, then generate polished, branded invoices in English, Albanian or Macedonian — from scratch, a saved template, or an AI draft."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Invoice SaaS" />
    <meta property="og:locale" content="en" />
    <meta
      property="og:title"
      content="Invoice SaaS — branded invoices for the Balkans, in minutes"
    />
    <meta
      property="og:description"
      content="Set up your business once, then generate polished, branded invoices in English, Albanian or Macedonian — from scratch, a saved template, or an AI draft."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Invoice SaaS — branded invoices for the Balkans, in minutes"
    />
    <meta
      name="twitter:description"
      content="Set up your business once, then generate polished, branded invoices in English, Albanian or Macedonian — from scratch, a saved template, or an AI draft."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
